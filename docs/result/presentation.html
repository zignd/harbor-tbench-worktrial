<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generating Terminal-Bench tasks that are learnable</title><style>
:root{--bg:#0f1b2a;--panel:#16283d;--ink:#eaf1f8;--mut:#9fb4c8;--acc:#2a9d8f;--warn:#e9c46a;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Calibri,Arial,sans-serif}
.slide{display:none;min-height:100vh;padding:6vh 9vw;flex-direction:column;justify-content:center}
.slide.on{display:flex}
h1{font:700 46px/1.15 Cambria,Georgia,serif;margin:0 0 .4em}
h2{font:700 34px/1.2 Cambria,Georgia,serif;margin:0 0 .5em;color:var(--acc)}
p,li{max-width:60ch} .mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border-radius:12px;padding:16px 18px}
.card b{display:block;font-size:30px;color:var(--acc);margin-top:6px}
.tag{background:var(--acc);color:#04241f;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.warn{color:var(--warn)} .bad{color:var(--bad)}
.foot{position:fixed;bottom:10px;right:16px;color:var(--mut);font-size:13px}
.nav{position:fixed;bottom:10px;left:16px;color:var(--mut);font-size:13px}
code{background:#0b1622;padding:2px 6px;border-radius:6px}</style></head><body>
<div id="deck"></div><div class="nav">← → to navigate</div><div class="foot" id="foot"></div>
<script>
const S = ["<h1>Generating Terminal-Bench tasks that are learnable</h1><p class='mut'>A pipeline that authors, gates and calibrates hard tasks \u2014 with exact-package evidence</p><p class='mut'>Models: openai/gpt-5.6-luna author, openrouter/openai/gpt-5.4-mini solver</p>", "<h2>The problem</h2><p>A task is useful only in the learnable band: run 5x with a solver, exactly 1-3 pass, and failures must be the model's fault, not the task's.</p><p class='mut'>Sonnet to Opus produced 0 of 9 in band; we rebuilt the pipeline and opened the model choice.</p>", "<h2>Models and scope</h2><div class='grid'><div class='card'>Author / reviewer / judge / red-team<b>openai/gpt-5.6-luna</b></div><div class='card'>Calibration solver<b>openrouter/openai/gpt-5.4-mini</b></div><div class='card'>Novelty pool<b>Terminal-Bench 2.1 (89 tasks) + examples/</b></div></div>", "<h2>Pipeline</h2><p>spec &rarr; blueprint &rarr; rubric + novelty gate &rarr; in-container authoring meta-task &rarr; structure/lint/leak &rarr; oracle 3/3 + nop &rarr; <code>harbor check</code> quality &rarr; novelty re-check &rarr; red-team &rarr; calibration (5x, exact curtailment) &rarr; ship in band.</p>", "<h2>Difficulty by construction</h2><p>An author as strong as the solver cannot out-think it, so difficulty is built in: hidden-seed verify-time inputs, dependent multi-stage work, shallow-self-check traps, long-horizon inputs. Every tested requirement is stated.</p>", "<h2>Candidate batch</h2><div class='grid'><div class='card'>Records<b>22</b></div><div class='card'>Fresh / reused<b>12 / 10</b></div><div class='card'>Learnable<b>3</b></div><div class='card'>Too hard / too easy<b>6 / 1</b></div><div class='card'>Invalid<b>7</b></div></div><p class='mut'>Bimodal, as Tmax predicts without continuous difficulty control.</p>", "<h2>The audit that changed the story</h2><p class='bad'>Four previously 'shipped' tasks were rejected: no immutable calibration inside the package, one shipped on a single judged pass, stale READMEs, and the report's counts disagreeing.</p><p>They are archived unchanged, not deleted.</p>", "<h2>Verification discipline</h2><p>Approval = a content-hash-bound calibration record + verification record inside the package. A directory is not approval. Verification runs offline at build time; independent oracle 3/3 and nop re-run; reports use only the declared model pair.</p><p class='warn'>No task approved. Three quality-clean packages measured out of band:</p><ul><li>releaseforge &mdash; <b>0/5</b> too hard</li><li>optimize-policy-decision-audit &mdash; <b>4/5</b> too easy</li><li>repair-attributed-funnel-service &mdash; <b>2 passes</b>, one trial hit the turn cap (invalid)</li></ul>", "<h2>Stretch goals</h2><p><b>A</b> curtailment lossless, ~12-23% trials saved (dollar figure caveated). <b>B</b> tuning implemented, <span class='warn'>no in-band movement demonstrated</span>. <b>C</b> coverage + novelty reported on the TB 2.1 pool. <b>D</b> blind accuracy 0.38 (95% CI 0.21-0.57); examples 183 words vs generated 330.</p>", "<h2>Cost and time</h2><div class='grid'><div class='card'>Key spend<b>$215.96</b></div><div class='card'>Remaining<b>$284.04</b></div><div class='card'>Luna/mini ledger<b>$16.47</b></div></div><p class='mut'>Ledger over-counts across scopes; the key is authoritative, reconciliation open.</p>", "<h2>Limitations and next steps</h2><ul><li>Small N; bimodal difficulty</li><li>Self-judging bias; author also judges</li><li>Reduced novelty scope (TB 2.1 + examples)</li><li>Turn-cap passes are invalid by rule</li></ul><p>Next: more specs, stronger traps, a wider solver gap, and a full 5-run re-audit.</p>"];
let idx = 0;
function render(){document.getElementById('deck').innerHTML = S.map((h,i) =>
  `<section class="slide${i===idx?' on':''}">${h}</section>`).join('');
  document.getElementById('foot').textContent = `${idx+1} / ${S.length}`;}
addEventListener('keydown', e => { if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();idx=Math.min(S.length-1,idx+1);render();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();idx=Math.max(0,idx-1);render();} });
render();
</script></body></html>
