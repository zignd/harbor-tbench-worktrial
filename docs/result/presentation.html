<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generating Terminal-Bench tasks that are learnable</title><style>
:root{--bg:#0f1b2a;--panel:#16283d;--ink:#eaf1f8;--mut:#9fb4c8;--acc:#2a9d8f;--warn:#e9c46a;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Calibri,Arial,sans-serif}
.slide{display:none;min-height:100vh;padding:6vh 9vw;flex-direction:column;justify-content:center}
.slide.on{display:flex}
h1{font:700 46px/1.15 Cambria,Georgia,serif;margin:0 0 .4em}
h2{font:700 34px/1.2 Cambria,Georgia,serif;margin:0 0 .5em;color:var(--acc)}
p,li{max-width:60ch} .mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border-radius:12px;padding:16px 18px}
.card b{display:block;font-size:30px;color:var(--acc);margin-top:6px}
.tag{background:var(--acc);color:#04241f;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.warn{color:var(--warn)} .bad{color:var(--bad)}
.foot{position:fixed;bottom:10px;right:16px;color:var(--mut);font-size:13px}
.nav{position:fixed;bottom:10px;left:16px;color:var(--mut);font-size:13px}
code{background:#0b1622;padding:2px 6px;border-radius:6px}.bars{margin:18px 0 10px}.barrow{display:flex;align-items:center;gap:12px;margin:10px 0}.barrow span{width:90px;font-weight:700}.barrow i{min-width:12px;height:30px;border-radius:6px;display:inline-block;vertical-align:middle}.barrow b{width:40px;text-align:right;font-size:20px}.pipe{font:700 20px/1.4 Cambria,serif;color:var(--acc);margin:10px 0 6px}.bandrow{display:flex;gap:8px;margin:24px 0 16px}.band{flex:1;border-radius:14px;text-align:center;padding:22px 8px;min-height:110px;display:flex;flex-direction:column;justify-content:center}.band em{font:800 48px/1 Cambria,Georgia,serif;font-style:normal;color:#fff;display:block}.band small{color:#fff;margin-top:6px;font-size:14px;font-weight:700}.band.ok{background:var(--acc)}.band.bad{background:var(--bad)}.band.warn{background:var(--warn);color:#2a1a02}.band.warn small{color:#2a1a02}.trials{display:flex;gap:10px;margin:18px 0 20px}.trial{flex:1;border-radius:14px;text-align:center;padding:18px 10px;font-weight:800;font-size:20px;background:var(--bad);color:#fff}.trial.ok{background:var(--acc)}.trial small{display:block;font-weight:400;font-size:13px;margin-top:4px;opacity:.85}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px}.next p{background:var(--panel);border-radius:12px;padding:12px 16px;margin:8px 0}.next b{color:var(--acc)}body{background:radial-gradient(circle at 15% 20%,rgba(53,208,186,.22),transparent 38%),radial-gradient(circle at 86% 8%,rgba(242,199,92,.16),transparent 42%),radial-gradient(circle at 50% 100%,rgba(139,124,255,.16),transparent 40%),var(--bg);background-size:150% 150%;animation:bgPan 18s ease-in-out infinite alternate}@keyframes bgPan{0%{background-position:0% 0%}100%{background-position:100% 100%}}.slide.on{animation:slideIn .48s cubic-bezier(.22,1,.36,1) both}@keyframes slideIn{0%{opacity:0;transform:translateY(18px) scale(.985)}100%{opacity:1;transform:none}}h1,h2{background-size:200% auto;animation:shimmer 6s linear infinite}@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}h1,.grad{background:linear-gradient(90deg,var(--ink),var(--acc),var(--gold),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}.card,.band,.trial{box-shadow:0 18px 45px rgba(0,0,0,.25);transition:transform .25s,box-shadow .25s}.card:hover,.band:hover{transform:translateY(-6px);box-shadow:0 28px 70px rgba(0,0,0,.35)}.band,on,.barrow i,.trial{transition:all .4s ease;animation:floaty 6s ease-in-out infinite}.band{animation:floaty calc(4s + var(--i,0)*.3s) ease-in-out infinite}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style></head><body>
<div id="deck"></div><div class="nav">← → to navigate</div><div class="foot" id="foot"></div>
<script>
const S = ["<div class='hero'><h1>Generating Terminal-Bench tasks that are learnable</h1><p>A pipeline that authors, gates and calibrates hard tasks \u2014 with exact-package evidence</p><p class='mut'>openai/gpt-5.6-luna \u00b7 openrouter/openai/gpt-5.4-mini</p></div>", "<h2>A task is useful only in the 1-3 of 5 band</h2><div class='bandrow'><div class='band bad'><em>0</em><small>too hard</small></div><div class='band ok'><em>1</em><small>learnable</small></div><div class='band ok'><em>2</em><small>learnable</small></div><div class='band ok'><em>3</em><small>learnable</small></div><div class='band warn'><em>4</em><small>too easy</small></div><div class='band warn'><em>5</em><small>too easy</small></div></div><p>Failures must be the model's fault \u2014 not a flaky environment or a hidden timeout.</p><p class='mut'>Sonnet \u2192 Opus: 0 of 9 in band. We rebuilt the pipeline.</p>", "<h2>Cheap gates first. Calibration is the difficulty signal.</h2><p class='pipe'>spec \u2192 blueprint \u2192 author \u2192 lint / leak \u2192 <b>oracle 3/3 + nop</b></p><p class='pipe'>quality \u2192 novelty \u2192 red-team \u2192 <b>calibrate 5\u00d7</b> \u2192 ship in band</p><p class='mut'>A directory in output/ is not approval \u2014 only a hash-bound record is.</p>", "<h2>One fixed pair. The band is relative to the solver.</h2><div class='grid3'><div class='card'><small>Author</small><b>gpt-5.6-luna</b><p>writes, reviews, judges, red-teams</p></div><div class='card'><small>Solver</small><b>gpt-5.4-mini</b><p>terminus-2 \u00b7 5 attempts \u00b7 100-turn cap</p></div><div class='card'><small>Novelty</small><b>TB 2.1</b><p>Terminal-Bench 2.1 (89 tasks) + examples/</p></div></div>", "<h2>The pool is bimodal. Most tasks miss the band.</h2><div class='bars'><div class='barrow'><span>Learnable (label)</span><i style='width:34%;background:var(--acc)'></i><b>3</b></div><div class='barrow'><span>Too easy</span><i style='width:11%;background:var(--warn)'></i><b>1</b></div><div class='barrow'><span>Too hard</span><i style='width:68%;background:var(--bad)'></i><b>6</b></div><div class='barrow'><span>Invalid</span><i style='width:80%;background:#7a8b99'></i><b>7</b></div></div><p class='mut'>17 of 22 records carry a verdict \u00b7 12/10 fresh/reused \u00b7 2 in band with a full 5-attempt record \u00b7 <b>1 approved after audit</b></p><p class='mut'>Verdict <i>labels</i> overstate this: 3 candidates are tagged learnable, but one is a curtailed 1/3 \u2014 not a full 1\u20133/5 statement \u2014 and one of the two full records ends in pipeline status <i>failed</i>.</p>", "<h2>The audit rejected four previously 'shipped' tasks</h2><div class='grid2'><div class='card'><small>01</small><p>No hash-bound calibration inside the package</p></div><div class='card'><small>02</small><p>One shipped on a single judged pass, not 1-3/5</p></div><div class='card'><small>03</small><p>Stale READMEs citing ids that never existed</p></div><div class='card'><small>04</small><p>A directory is not approval. Archived, not deleted.</p></div></div>", "<h2>One task approved: optimize-policy-decision-audit</h2><div class='trials'><div class='trial ok'>PASS<small>#1</small></div><div class='trial ok'>PASS<small>#2</small></div><div class='trial ok'>PASS<small>#3</small></div><div class='trial bad'>FAIL<small>#4</small></div><div class='trial bad'>FAIL<small>#5</small></div></div><div class='grid3'><div class='card'><small>honest passes</small><b>3 / 5</b></div><div class='card'><small>pooled</small><b>7 / 10 = 0.70</b></div><div class='card'><small>oracle \u00b7 nop</small><b>3 / 3 \u00b7 0</b></div></div>", "<h2>Stretch goals \u2014 measured, including negatives</h2><div class='grid2'><div class='card'><small>A cost</small><b>26.5% of trials saved</b><p>~$3.79 vs naive 5\u00d7. Invalid-run early stops credited with nothing.</p></div><div class='card'><small>B tuning</small><b>not demonstrated</b><p>13 hash-bound tuning experiments; 0 moved into the band.</p></div><div class='card'><small>C diversity</small><b>TB 2.1 pool</b><p>Coverage, duplication and novelty on 89 published tasks.</p></div><div class='card'><small>D likeness</small><b>blind 0.38</b><p>95% CI 0.21-0.57. Rubric overfits: examples 0/6 vs generated 3/4.</p></div></div>", "<h2>Spend stayed inside the ceiling</h2><div class='grid3'><div class='card'><small>key spend of $500</small><b>$220</b></div><div class='card'><small>remaining</small><b>$280</b></div><div class='card'><small>this pair's ledger</small><b>$12.5</b></div></div><p class='mut'>The key is authoritative. Reconciliation is unresolved.</p>", "<h2>What we would do next</h2><div class='next'><p><b>Small N</b> One approved task. The pool is bimodal: 0, 0, 4, 5, 5.</p><p><b>Self-judging</b> The author also judges and red-teams.</p><p><b>Novelty</b> TB 2.1 + examples \u2014 not full decontamination.</p><p><b>Next</b> Stronger traps, a wider solver gap, difficulty near p \u2248 0.35.</p></div>", "<h2>Architecture at a glance</h2><div class='pipe'>spec &rarr; blueprint &rarr; author in a container &rarr; gates &rarr; calibration &rarr; ship</div><div class='grid2'><div class='card'><small>Gates before money</small><b>structure &rarr; oracle/nop &rarr; quality</b><p<|message|>cheap flags stop a run before calibration spend</p></div><div class='card'><small>Verification</small><b>oracle 3/3 &middot; nop 0</b><p<|message|>plus a 16-criterion quality rubric, novelty and red-team</p></div><div class='card'><small>Difficulty</small><b>hidden seed &amp; multi-stage</b><p<|message|>no stated wall-clock budgets, no answer-bearing files</p></div><div class='card'><small>Money</small><b>$12.48 this pair</b><p|key total $219.70 of $500 &middot; reconciliation open</p></div></div>", "<h2>Q&amp;A you should be ready for</h2><div class='grid2'><div class='card'><b>Is 1-3/5 just noise?</b><p<|message|>A p=0.5 task lands in band 78% of the time, so verdicts must be pooled: this task gives 7/10 = 0.70 across two batches.</p></div><div class='card'><b>How do you know it wasn't a hack?</b><p<|message|>lint, leak scan, anti-cheating criteria, red-team, command scan, then a pass audit that quotes the reasoning trace.</p></div><div class='card'><b>Why four failed and one passed?</b><p|bimodal: introducing invalid-failure modes to gain hardness, wall-clock removed as environment-dependent, author and solver too close in strength.</p></div><div class='card'><b>Would Sonnet write better tasks?</b><p|a 2x2 study (docs/study-report.md) produced no in-band task: the weak author wrote 0 valid tasks of 7; no cell cleared.</p></div></div>"];
let idx = 0;
function render(){document.getElementById('deck').innerHTML = S.map((h,i) =>
  `<section class="slide${i===idx?' on':''}">${h}</section>`).join('');
  document.getElementById('foot').textContent = `${idx+1} / ${S.length}`;}
addEventListener('keydown', e => { if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();idx=Math.min(S.length-1,idx+1);render();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();idx=Math.max(0,idx-1);render();} });
render();
</script></body></html>
