schema_version = "1.1"
# Harbor copies the finished package from the container to <trial>/artifacts/.
artifacts = ["/app/output"]

[task]
name = "$TASK_NAME"
description = "Meta-task: author one Terminal-Bench task package from a blueprint."

[metadata]
difficulty = "unknown"
category = "task-authoring"

[verifier]
timeout_sec = 300.0

[agent]
# The authoring meta-task only (140 turns can take ~75 min). Generated tasks keep 3600.
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
