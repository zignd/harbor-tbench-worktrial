schema_version = "1.1"
# Harbor copies the finished package from the container to <trial>/artifacts/.
artifacts = ["/app/output"]

[task]
name = "$TASK_NAME"
description = "Meta-task: author one Terminal-Bench task package from a blueprint."

[metadata]
difficulty = "unknown"
category = "task-authoring"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
