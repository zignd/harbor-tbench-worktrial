[project]
name = "harbor-tbench-worktrial"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "harbor==0.24.0",
    "openai>=1.59.9",
    "pydantic>=2.10.5",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["harbor", "examples", "data", "jobs", "output-dev", "tests/fixtures"]
