action: block
description: Blocks SQL injection with URL encoding in query strings
id: block-181
name: Block URL-encoded SQLi in query
patterns:
- description: URL-encoded SQL SELECT keyword in query
  flags:
  - IGNORECASE
  regex: (select|union|insert|update|delete|drop)(%20|\+)
  target: query
priority: 10
tags:
- sqli
- url-encoded
- auto-generated
