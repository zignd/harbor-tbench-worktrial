action: block
description: Blocks SQL injection with URL-encoded quotes in query strings
id: block-182
name: Block URL-encoded quote SQLi in query
patterns:
- description: URL-encoded single quote followed by SQL keyword in query
  flags:
  - IGNORECASE
  regex: (%27|%22|').*(or|and|union|select|insert|delete|drop|update)(%20|\+)
  target: query
priority: 10
tags:
- sqli
- url-encoded
- auto-generated
