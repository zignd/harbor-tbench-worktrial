# channels.conf - Sensor channel configuration
# Format: <channel_name>  <ema_window_size>
# Window size controls how many periods the EMA spans.
# Larger window = smoother signal, slower response.

# Temperature sensor (Celsius) - fast-response window
temp        20

# Atmospheric pressure sensor (bar) - long-window smoothing
pressure    100

# Relative humidity sensor (percent) - medium window
humidity    50
