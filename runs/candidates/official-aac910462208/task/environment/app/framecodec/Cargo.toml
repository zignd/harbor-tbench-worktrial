[package]
name = "framecodec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "framecodec"
path = "src/main.rs"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.hyper-util]
version = ">=0.1.0, <0.1.14"
features = ["tokio"]
optional = false
