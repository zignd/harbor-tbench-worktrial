[package]
name = "packet-codec"
version = "0.1.0"
edition = "2021"

[lib]
name = "packet_codec"
path = "src/lib.rs"

[[bin]]
name = "packet-codec"
path = "src/main.rs"

[dependencies]
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 1
