[package]
name = "sensor_pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sensor_pipeline"
path = "src/main.rs"

[dependencies]
crc32fast = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
