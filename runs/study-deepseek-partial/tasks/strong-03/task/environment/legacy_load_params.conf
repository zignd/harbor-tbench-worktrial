# Legacy load balancing parameters (no longer used)
# This file was referenced by the old dispatch daemon, not by allocator itself.

[global]
shard_count = 3
default_load_weight = 1.0

[shard_0]
host = 10.0.1.100
port = 5432
max_load = 10000

[shard_1]
host = 10.0.1.101
port = 5432
max_load = 10000

[shard_2]
host = 10.0.1.102
port = 5432
max_load = 10000

[dispatch]
algorithm = greedy_lowest_load
tie_breaker = shard_index
retry_limit = 3
retry_delay_ms = 100

[logging]
level = INFO
file = /var/log/dispatch/allocator.log
max_size_mb = 50
backup_count = 5
